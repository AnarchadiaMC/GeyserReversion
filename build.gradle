plugins {
    id 'java'
    id "com.gradleup.shadow" version "8.3.0"
    id "com.modrinth.minotaur" version "2.9.0"
}

group = 'oxy.geyser.reversion'
version = '1.0.5'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    // Hosts the Geyser/Cloudburst unique snapshot artifacts (protocol BetaX) and their sources.
    // Fetches for timestamped versions such as 3.0.0.Beta13-20260824.114016-17 are served from
    // the 3.0.0.Beta13-SNAPSHOT/ directory, which this repository exposes.
    maven { url = "https://repo.opencollab.dev/main/" }
}

configurations {
    correspondingDependencySources {
        canBeConsumed = false
        transitive = false
    }
    legacyDataTools {
        canBeConsumed = false
        canBeResolved = true
    }
}

dependencies {
    // Corresponding sources for the dependencies bundled into the shadow jar.
    // Every entry below was verified to publish a resolvable ':sources' variant.
    correspondingDependencySources 'org.allaymc.stateupdater:common:0.1.1:sources'
    correspondingDependencySources 'org.allaymc.stateupdater:block-updater:1.21.110-R1:sources'
    correspondingDependencySources 'com.google.code.gson:gson:2.13.2:sources'
    correspondingDependencySources 'cn.hutool:hutool-core:5.8.40:sources'
    correspondingDependencySources 'com.fasterxml.jackson.core:jackson-annotations:2.17.0:sources'
    correspondingDependencySources 'com.fasterxml.jackson.core:jackson-core:2.17.0:sources'
    correspondingDependencySources 'com.fasterxml.jackson.core:jackson-databind:2.17.0:sources'
    correspondingDependencySources 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.17.0:sources'
    correspondingDependencySources 'org.yaml:snakeyaml:2.2:sources'
    correspondingDependencySources 'net.lenni0451.classtransform:core:1.14.1:sources'
    correspondingDependencySources 'net.lenni0451:Reflect:1.5.0:sources'
    // Cloudburst fastutil publishes sources for all modules below.
    correspondingDependencySources 'org.cloudburstmc.fastutil:core:8.5.15:sources'
    correspondingDependencySources 'org.cloudburstmc.fastutil.sets:object-sets:8.5.15:sources'
    correspondingDependencySources 'org.cloudburstmc.fastutil.sets:long-sets:8.5.15:sources'
    correspondingDependencySources 'org.cloudburstmc.fastutil.sets:int-sets:8.5.15:sources'
    correspondingDependencySources 'org.cloudburstmc.fastutil.maps:object-int-maps:8.5.15:sources'
    correspondingDependencySources 'org.cloudburstmc.fastutil.maps:long-object-maps:8.5.15:sources'
    correspondingDependencySources 'org.cloudburstmc.fastutil.maps:int-object-maps:8.5.15:sources'
    correspondingDependencySources 'org.cloudburstmc.fastutil.commons:object-common:8.5.15:sources'
    correspondingDependencySources 'org.cloudburstmc.fastutil.commons:long-common:8.5.15:sources'
    correspondingDependencySources 'org.cloudburstmc.fastutil.commons:int-common:8.5.15:sources'
    correspondingDependencySources 'org.cloudburstmc.protocol:bedrock-codec:3.0.0.Beta13-20260824.114016-17:sources'
    correspondingDependencySources 'org.cloudburstmc.protocol:common:3.0.0.Beta13-20260824.114016-17:sources'
    correspondingDependencySources 'org.cloudburstmc.protocol:bedrock-connection:3.0.0.Beta13-20260824.114016-17:sources'

    // Offline generator for the legacy per-protocol data directories; never bundled into the JAR.
    legacyDataTools("org.cloudburstmc:nbt:3.0.5.Final")
    legacyDataTools("com.google.code.gson:gson:2.13.2")

    compileOnly("org.geysermc.geyser:core:2.11.2-20260910.131131-9") {
        exclude group: "com.google.code.gson", module: "gson"
    }
    // Geyser provides this at runtime; the extension directly uses its listener options.
    compileOnly("org.cloudburstmc.netty:netty-transport-raknet:1.1.0.CR1-20260820.174333-6")
    // Provided by the Geyser runtime. Pinned to the exact Beta13 build that Geyser core 2.11.2
    // depends on so the Beta13 API surface is the compile classpath (never bundled).
    compileOnly("org.cloudburstmc.protocol:bedrock-codec:3.0.0.Beta13-20260824.114016-17")
    compileOnly("org.cloudburstmc.protocol:common:3.0.0.Beta13-20260824.114016-17")
    compileOnly("org.cloudburstmc.protocol:bedrock-connection:3.0.0.Beta13-20260824.114016-17")
    compileOnly("org.projectlombok:lombok:1.18.36")
    annotationProcessor("org.projectlombok:lombok:1.18.36")

    testImplementation("org.geysermc.geyser:core:2.11.2-20260910.131131-9")
    testImplementation(platform("org.junit:junit-bom:5.11.4"))
    testImplementation("org.junit.jupiter:junit-jupiter")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")

    // Bundled into the shadow jar.
    implementation("com.fasterxml.jackson.core:jackson-annotations:2.17.0")
    implementation("com.fasterxml.jackson.core:jackson-databind:2.17.0")
    implementation("com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.17.0")
    implementation("org.yaml:snakeyaml:2.2")
    implementation("net.lenni0451.classtransform:core:1.14.1")
    implementation("net.lenni0451:Reflect:1.5.0")
    implementation("com.google.code.gson:gson:2.13.2")
    implementation("cn.hutool:hutool-core:5.8.40")
    implementation("org.allaymc.stateupdater:common:0.1.1")
    implementation("org.allaymc.stateupdater:block-updater:1.21.110-R1")
    implementation("org.cloudburstmc.fastutil:core:8.5.15")
    implementation("org.cloudburstmc.fastutil.sets:object-sets:8.5.15")
    implementation("org.cloudburstmc.fastutil.sets:long-sets:8.5.15")
    implementation("org.cloudburstmc.fastutil.sets:int-sets:8.5.15")
    implementation("org.cloudburstmc.fastutil.maps:object-int-maps:8.5.15")
    implementation("org.cloudburstmc.fastutil.maps:long-object-maps:8.5.15")
    implementation("org.cloudburstmc.fastutil.maps:int-object-maps:8.5.15")
    implementation("org.cloudburstmc.fastutil.commons:object-common:8.5.15")
    implementation("org.cloudburstmc.fastutil.commons:long-common:8.5.15")
    implementation("org.cloudburstmc.fastutil.commons:int-common:8.5.15")
}

shadowJar {
    dependencies {
        include(dependency("com.fasterxml.jackson.core:jackson-annotations:2.17.0"))
        include(dependency("com.fasterxml.jackson.core:jackson-core:2.17.0"))
        include(dependency("com.fasterxml.jackson.core:jackson-databind:2.17.0"))
        include(dependency("com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.17.0"))
        include(dependency("org.yaml:snakeyaml:2.2"))

        include(dependency("net.lenni0451.classtransform:core:1.14.1"))
        include(dependency("net.lenni0451:Reflect:1.5.0"))
        include(dependency("org.ow2.asm:asm:9.8"))
        include(dependency("org.ow2.asm:asm-analysis:9.8"))
        include(dependency("org.ow2.asm:asm-commons:9.8"))
        include(dependency("org.ow2.asm:asm-tree:9.8"))

        include(dependency("com.google.code.gson:gson:2.13.2"))
        include(dependency("cn.hutool:hutool-core:5.8.40"))

        include(dependency("org.allaymc.stateupdater:common:0.1.1"))
        include(dependency("org.allaymc.stateupdater:block-updater:1.21.110-R1"))

        include(dependency("org.cloudburstmc.fastutil:core:8.5.15"))
        include(dependency("org.cloudburstmc.fastutil.sets:object-sets:8.5.15"))
        include(dependency("org.cloudburstmc.fastutil.sets:long-sets:8.5.15"))
        include(dependency("org.cloudburstmc.fastutil.sets:int-sets:8.5.15"))
        include(dependency("org.cloudburstmc.fastutil.maps:object-int-maps:8.5.15"))
        include(dependency("org.cloudburstmc.fastutil.maps:long-object-maps:8.5.15"))
        include(dependency("org.cloudburstmc.fastutil.maps:int-object-maps:8.5.15"))
        include(dependency("org.cloudburstmc.fastutil.commons:object-common:8.5.15"))
        include(dependency("org.cloudburstmc.fastutil.commons:long-common:8.5.15"))
        include(dependency("org.cloudburstmc.fastutil.commons:int-common:8.5.15"))
    }

    // jackson-core/databind/dataformat-yaml ship META-INF/services entries under overlapping names.
    mergeServiceFiles()

    relocate("com.fasterxml.jackson", "oxy.geyser.reversion.shaded.jackson")
    relocate('org.yaml.snakeyaml', 'oxy.geyser.reversion.shaded.yaml')
    relocate('org.objectweb.asm', 'oxy.geyser.reversion.shaded.asm')
    relocate('net.lenni0451.reflect', 'oxy.geyser.reversion.shaded.reflect')
    relocate('net.lenni0451.classtransform', 'oxy.geyser.reversion.shaded.classtransform')
    relocate('com.google.gson', 'oxy.geyser.reversion.shaded.gson')
    relocate('cn.hutool', 'oxy.geyser.reversion.shaded.hutool')
    relocate('org.allaymc', 'oxy.geyser.reversion.shaded.allaymc')
    // The Cloudburst fastutil fork still ships classes in the upstream it.unimi.dsi.fastutil
    // package, so this is the relocation that actually shades them.
    relocate('it.unimi.dsi.fastutil', 'oxy.geyser.reversion.shaded.fastutil')
    // Inert with the coordinates above (no classes in this package), kept as the documented
    // namespace for the Cloudburst fastutil artifacts.
    relocate('org.cloudburstmc.fastutil', 'oxy.geyser.reversion.shaded.fastutil')
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    versionName = version + "-" + getCommitHash()
    versionNumber = version + "-" + getCommitHash()
    changelog = getCommitMessage()
    projectId = "geyserreversion"
    versionType = "alpha"
    uploadFile = shadowJar
    // Don't comment on this :)
    gameVersions = ["1.8","1.8.1","1.8.2","1.8.3","1.8.4","1.8.5","1.8.6","1.8.7","1.8.8","1.8.9","1.9","1.9.1","1.9.2","1.9.3","1.9.4","1.10","1.10.1","1.10.2","1.11","1.11.1","1.11.2","1.12","1.12.1","1.12.2","1.13","1.13.1","1.13.2","1.14","1.14.1","1.14.2","1.14.3","1.14.4","1.15","1.15.1","1.15.2","1.16","1.16.1","1.16.2","1.16.3","1.16.4","1.16.5","1.17","1.17.1","1.18","1.18.1","1.18.2","1.19","1.19.1","1.19.2","1.19.3","1.19.4","1.20","1.20.1","1.20.2","1.20.3","1.20.4","1.20.5","1.20.6","1.21","1.21.1","1.21.2","1.21.3","1.21.4","1.21.5","1.21.6","1.21.7","1.21.8","1.21.9","1.21.10","1.21.11"];
    loaders = ["geyser"]
}

tasks.named('test') {
    useJUnitPlatform()
    // The exhaustive matrix retains every vanilla block palette simultaneously.
    maxHeapSize = '3g'
    jvmArgs '-Dio.netty.leakDetection.level=paranoid'
    testLogging { events 'failed', 'skipped'; exceptionFormat 'full' }
    if (project.hasProperty('integrationPort')) {
        systemProperty 'reversion.integration.port', project.property('integrationPort')
    }
}

// Regenerates src/main/resources/vanilla/v332, v340 and v354 from the upstream inputs checked in
// under tools/legacy-data-converter/data. Provenance and checksum policy: docs/LEGACY-DATA.md.
tasks.register('compileLegacyDataConverter', JavaCompile) {
    description = 'Compiles the offline legacy data converter under tools/legacy-data-converter.'
    source = fileTree('tools/legacy-data-converter/src/main/java') { include '**/*.java' }
    classpath = configurations.legacyDataTools
    destinationDirectory = layout.buildDirectory.dir('legacy-data-converter/classes')
    options.encoding = 'UTF-8'
}

tasks.register('generateLegacyData', JavaExec) {
    description = 'Regenerates the legacy v332/v340/v354 vanilla data from the checked-in upstream inputs.'
    group = 'verification'
    dependsOn 'compileLegacyDataConverter'
    classpath = files(tasks.named('compileLegacyDataConverter', JavaCompile).flatMap { it.destinationDirectory },
            configurations.legacyDataTools)
    mainClass = 'oxy.geyser.reversion.tools.LegacyDataConverter'
    args '--source', file('tools/legacy-data-converter/data').absolutePath,
            '--output', file('src/main/resources/vanilla').absolutePath
    if (project.hasProperty('legacyDataModes')) {
        args '--modes', project.property('legacyDataModes')
    }
}

tasks.register('validateAll') {
    description = 'Aggregate verification task; currently the full test suite.'
    group = 'verification'
    dependsOn tasks.named('test')
}

processResources {
    // Ouranos, BedrockData and Schema licenses already live in src/main/resources/META-INF/licenses.
    from('LICENSE') { into 'META-INF/licenses'; rename { 'GeyserReversion-GPL-3.0.txt' } }
    from('THIRD_PARTY_NOTICES.md') { into 'META-INF' }
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.register('sourceRelease', Zip) {
    archiveClassifier = 'corresponding-source'
    destinationDirectory = layout.buildDirectory.dir('libs')
    from(configurations.correspondingDependencySources) { into 'dependency-sources' }
    // Explicit allowlist: no .git history/config, IDE settings, credentials or server data.
    from(projectDir) {
        include 'src/**', 'docs/**', 'gradle/**', 'tools/**', 'gradlew', 'gradlew.bat'
        include 'build.gradle', 'settings.gradle', '.gitignore', '.gitattributes', 'LICENSE'
        include 'README.md', 'UPSTREAM_ATTRIBUTION.md', 'THIRD_PARTY_NOTICES.md'
    }
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

def getCommitMessage() {
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'log', '-1', '--pretty=%B'
            standardOutput = stdout
            errorOutput = new ByteArrayOutputStream()
        }
        def message = stdout.toString().trim()
        return message.isEmpty() ? 'Build from corresponding source archive' : message
    } catch (Exception ignored) {
        return 'Build from corresponding source archive'
    }
}

// Works with normal clones and git worktrees (`.git` may be a file or absent).
def getCommitHash() {
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'rev-parse', '--short=7', 'HEAD'
            standardOutput = stdout
            errorOutput = new ByteArrayOutputStream()
        }
        def hash = stdout.toString().trim()
        return hash.isEmpty() ? 'source' : hash
    } catch (Exception ignored) {
        return 'source'
    }
}
