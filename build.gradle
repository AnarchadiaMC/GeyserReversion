plugins {
    id 'java'
    id "com.gradleup.shadow" version "8.3.0"
    id "com.modrinth.minotaur" version "2.9.0"
}

group = 'oxy.geyser.reversion'
version = '1.0.5'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven {url = "https://repo.opencollab.dev/main/"}
}

// Build a disposable patched copy: never mutate the user's submodule during a build.
tasks.register('prepareOuranos', Sync) {
    from('Ouranos') {
        exclude '.git', '**/.git', '.gradle/**', 'build/**', '**/.github/**'
    }
    into layout.buildDirectory.dir('ouranos-src')
    outputs.upToDateWhen { false }
}

configurations {
    correspondingDependencySources {
        canBeConsumed = false
        transitive = false
    }
}

tasks.register('buildOuranos', Exec) {
    dependsOn 'prepareOuranos'
    workingDir layout.buildDirectory.dir('ouranos-src')
    doFirst {
        exec {
            workingDir projectDir
            commandLine 'git', 'apply', '--check', '--directory=build/ouranos-src', file('patches/ouranos-compat.patch').absolutePath
        }
        exec {
            workingDir projectDir
            commandLine 'git', 'apply', '--directory=build/ouranos-src', file('patches/ouranos-compat.patch').absolutePath
        }
        copy {
            from 'patches/ouranos-src'
            into layout.buildDirectory.dir('ouranos-src/src/main/java')
        }
    }
    if (System.getProperty('os.name').toLowerCase().contains('windows')) {
        commandLine 'cmd', '/c', 'gradlew.bat', 'clean', 'shadowJar', '--no-daemon'
    } else {
        commandLine './gradlew', 'clean', 'shadowJar', '--no-daemon'
    }
}

// Make compileJava depend on building Ouranos first
compileJava.dependsOn buildOuranos


dependencies {
    correspondingDependencySources 'org.allaymc.stateupdater:common:0.1.1:sources'
    correspondingDependencySources 'org.allaymc.stateupdater:block-updater:1.21.110-R1:sources'
    correspondingDependencySources 'org.cloudburstmc.protocol:bedrock-codec:3.0.0.Beta12-20260721.182844-29:sources'
    correspondingDependencySources 'org.cloudburstmc.protocol:common:3.0.0.Beta12-20260721.182844-30:sources'
    correspondingDependencySources 'org.cloudburstmc.protocol:bedrock-connection:3.0.0.Beta12-20260721.182844-30:sources'
    compileOnly("org.geysermc.geyser:core:2.11.2-20260910.131131-9") {
        exclude group: "com.google.code.gson", module: "gson"
    }
    // Geyser provides this at runtime; the extension directly uses its listener options.
    compileOnly("org.cloudburstmc.netty:netty-transport-raknet:1.1.0.CR1-20260820.174333-6")
    compileOnly("org.projectlombok:lombok:1.18.36")
    annotationProcessor("org.projectlombok:lombok:1.18.36")

    // Use Ouranos shadowJar from submodule build output
    implementation(files("build/ouranos-src/build/libs/ouranos-1.0-all.jar"))
    testImplementation("org.geysermc.geyser:core:2.11.2-20260910.131131-9")
    testImplementation(platform("org.junit:junit-bom:5.11.4"))
    testImplementation("org.junit.jupiter:junit-jupiter")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
    implementation("com.fasterxml.jackson.core:jackson-annotations:2.17.0")
    implementation("com.fasterxml.jackson.core:jackson-databind:2.17.0")
    implementation("com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.17.0")
    implementation("org.yaml:snakeyaml:2.2")

    implementation("net.lenni0451.classtransform:core:1.14.1")
    implementation("net.lenni0451:Reflect:1.5.0")
}

shadowJar {
    dependencies {
        include(dependency(files("build/ouranos-src/build/libs/ouranos-1.0-all.jar")))
        include(dependency("com.fasterxml.jackson.core:jackson-databind:2.17.0"))
        include(dependency("com.fasterxml.jackson.core:jackson-annotations:2.17.0"))
        include(dependency("com.fasterxml.jackson.core:jackson-core:2.17.0"))
        include(dependency("com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.17.0"))
        include(dependency("org.yaml:snakeyaml:2.2"))

        include(dependency("net.lenni0451.classtransform:core:1.14.1"))
        include(dependency("net.lenni0451:Reflect:1.5.0"))

        include(dependency("org.ow2.asm:asm:9.8"))
        include(dependency("org.ow2.asm:asm-analysis:9.8"))
        include(dependency("org.ow2.asm:asm-commons:9.8"))
        include(dependency("org.ow2.asm:asm-tree:9.8"))
    }

    relocate("com.fasterxml.jackson", "oxy.geyser.reversion.shaded.jackson")
    relocate('org.yaml.snakeyaml', 'oxy.geyser.reversion.shaded.yaml')
    relocate('org.objectweb.asm', 'oxy.geyser.reversion.shaded.asm')
    relocate('net.lenni0451.reflect', 'oxy.geyser.reversion.shaded.reflect')
    relocate('net.lenni0451.classtransform', 'oxy.geyser.reversion.shaded.classtransform')
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    versionName = version + "-" + getCommitHash()
    versionNumber = version + "-" + getCommitHash()
    changelog = getCommitMessage()
    projectId = "geyserreversion"
    versionType = "alpha"
    uploadFile = shadowJar
    // Don't comment on this :)
    gameVersions = ["1.8","1.8.1","1.8.2","1.8.3","1.8.4","1.8.5","1.8.6","1.8.7","1.8.8","1.8.9","1.9","1.9.1","1.9.2","1.9.3","1.9.4","1.10","1.10.1","1.10.2","1.11","1.11.1","1.11.2","1.12","1.12.1","1.12.2","1.13","1.13.1","1.13.2","1.14","1.14.1","1.14.2","1.14.3","1.14.4","1.15","1.15.1","1.15.2","1.16","1.16.1","1.16.2","1.16.3","1.16.4","1.16.5","1.17","1.17.1","1.18","1.18.1","1.18.2","1.19","1.19.1","1.19.2","1.19.3","1.19.4","1.20","1.20.1","1.20.2","1.20.3","1.20.4","1.20.5","1.20.6","1.21","1.21.1","1.21.2","1.21.3","1.21.4","1.21.5","1.21.6","1.21.7","1.21.8","1.21.9","1.21.10","1.21.11","26.1.1","26.1.2","26.2"];
    loaders = ["geyser"]
}

tasks.named('test') {
    useJUnitPlatform()
    // The exhaustive matrix retains every vanilla block palette simultaneously.
    maxHeapSize = '3g'
    jvmArgs '-Dio.netty.leakDetection.level=paranoid'
    testLogging { events 'failed', 'skipped'; exceptionFormat 'full' }
    if (project.hasProperty('integrationPort')) {
        systemProperty 'reversion.integration.port', project.property('integrationPort')
    }
}

processResources {
    from('LICENSE') { into 'META-INF/licenses'; rename { 'GeyserReversion-GPL-3.0.txt' } }
    from('Ouranos/LICENSE') { into 'META-INF/licenses'; rename { 'Ouranos-AGPL-3.0.txt' } }
    from('Ouranos/src/main/resources/vanilla/LICENSE') {
        into 'META-INF/licenses'; rename { 'BedrockData-LGPL-2.1.txt' }
    }
    from('Ouranos/src/main/resources/schema/LICENSE') {
        into 'META-INF/licenses'; rename { 'Schema-CC0-1.0.txt' }
    }
    from('THIRD_PARTY_NOTICES.md') { into 'META-INF' }
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.register('sourceRelease', Zip) {
    archiveClassifier = 'corresponding-source'
    destinationDirectory = layout.buildDirectory.dir('libs')
    from(configurations.correspondingDependencySources) { into 'dependency-sources' }
    // Explicit allowlist: no .git history/config, IDE settings, credentials or server data.
    from(projectDir) {
        include 'src/**', 'patches/**', 'docs/**', 'gradle/**', 'gradlew', 'gradlew.bat'
        include 'build.gradle', 'settings.gradle', '.gitmodules', '.gitignore', 'LICENSE'
        include 'README.md', 'UPSTREAM_ATTRIBUTION.md', 'THIRD_PARTY_NOTICES.md'
    }
    from('Ouranos') {
        into 'Ouranos'
        include 'src/**', 'gradle/**', 'gradlew', 'gradlew.bat', '*.gradle.kts', '*.md', 'LICENSE'
        exclude '**/.git', '**/.github/**'
    }
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

def getCommitMessage() {
    if (!file('.git').exists()) return 'Build from corresponding source archive'
    def stdout = new ByteArrayOutputStream()
    exec {
        commandLine 'git', 'log', '-1', '--pretty=%B'
        standardOutput = stdout
    }
    return stdout.toString().trim()
}

// Thanks to https://gist.github.com/JonasGroeger/7620911 :tm:
def getCommitHash() {
    if (!file('.git').exists()) return 'source'
    def gitFolder = "$projectDir/.git/"
    def takeFromHash = 7
    def head = new File(gitFolder + "HEAD").text.split(":")
    def isCommit = head.length == 1

    if(isCommit) return head[0].trim().take(takeFromHash)

    def refHead = new File(gitFolder + head[1].trim())
    refHead.text.trim().take takeFromHash
}
